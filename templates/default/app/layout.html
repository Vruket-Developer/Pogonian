<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .AppName }}</title>
    <link rel="stylesheet" href="/globals.css">
    <!-- Pogonian Runtime for soft navigation and async forms -->
    <script src="/_pogn/runtime.js" defer></script>
    <script src="/globals.js" defer></script>
</head>
<body class="pogn-body">
    <header class="pogn-header">
        <div class="container nav-container">
            <a href="/" class="brand-logo">
                <span class="logo-badge">P</span>
                <strong>{{ .AppName }}</strong>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/products" class="nav-link">Products</a>
                <a href="/feedback" class="nav-link">Feedback</a>
                <a href="/architecture" class="nav-link">Architecture</a>
                <a href="/login" class="nav-link">Sign In</a>
                <a href="/__pogn/devtools" class="nav-link" style="color: #38bdf8;">⚡ DevTools</a>
            </nav>
        </div>
    </header>

    <main id="pogn-root" class="container main-content">
        {{ .Content }}
    </main>

    <footer class="pogn-footer">
        <div class="container footer-content">
            <p>Built with <a href="https://github.com/pogonian/pogonian" target="_blank">Pogonian</a> — HTML-first & Go backend.</p>
        </div>
    </footer>
</body>
</html>
