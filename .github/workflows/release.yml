name: Release & Multi-Platform Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-release:
    name: Build Native Binaries & GitHub Release
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract Tag / Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build All Cross-Platform Native Binaries
        run: |
          chmod +x scripts/release-binaries.sh
          ./scripts/release-binaries.sh

      - name: Create GitHub Release and Attach Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "Pogonian v${{ steps.vars.outputs.version }}"
          tag_name: "v${{ steps.vars.outputs.version }}"
          files: |
            dist/binaries/pogn-linux-amd64
            dist/binaries/pogn-linux-arm64
            dist/binaries/pogn-darwin-amd64
            dist/binaries/pogn-darwin-arm64
            dist/binaries/pogn-windows-amd64.exe
            dist/binaries/pogn-windows-arm64.exe
            dist/binaries/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
